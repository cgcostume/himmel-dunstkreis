name: CI

# Temporarily reduced to manual dispatch only. The dev site (static/) needs @himmel/sternzeit, which is not
# published yet, so it is declared as "file:../himmel-sternzeit". That path does not exist in a bare clone of
# this repo, and `pnpm install --frozen-lockfile` fails here before it gets to anything worth running. Restore
# the `push`/`pull_request` triggers below once sternzeit is on npm and the dependency becomes a plain range.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test
